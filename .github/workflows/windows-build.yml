name: Build Windows EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install kivy kivy_deps.angle pyinstaller arabic-reshaper python-bidi

    - name: Build with PyInstaller
      env:
        KIVY_GL_BACKEND: mock
      run: |
        pyinstaller --onefile --windowed --add-data "Polar Owl of Darknedd.jpeg;." --add-data "dragon-studio-scary-scream-401725.mp3;." --add-data "Ambience.mp3;." main.py

    - name: Upload EXE as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Python-attempt-exe
        path: dist/*.exe
