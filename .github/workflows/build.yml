
name: Build Jumpscare APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore: 
      - document/**

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool \
            libltdl-dev pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev automake \
            autopoint gettext build-essential

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer setuptools \
            cython==0.29.34

      - name: Build APK
        run: buildozer -v android debug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: jumpscare-apk
          path: bin/*.apk
          if-no-files-found: error
